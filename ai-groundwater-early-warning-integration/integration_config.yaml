# Limitations

This prototype is limited to station locations present in the supplied Jaipur dataset. It has no rainfall, abstraction, recharge, aquifer, or administrative-boundary covariates. The temporal history is short and irregular/semiannual, so performance and uncertainty must be evaluated after training before operational use. Stress thresholds are project-defined data quantiles, not government thresholds. Missing dependencies prevented execution in the delivery environment; no model metrics or dashboard values are precomputed.
